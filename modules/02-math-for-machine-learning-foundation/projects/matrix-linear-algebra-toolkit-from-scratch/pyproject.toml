[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linear-algebra-toolkit-from-scratch"
version = "0.1.0"
description = "Educational pure-Python vector, matrix, Gaussian elimination, eigenvalue, and PCA routines"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "AI-ML-Engineering-Journey contributors" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "numpy>=1.26"]
demo = ["matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
